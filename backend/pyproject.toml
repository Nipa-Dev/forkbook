[project]
name = "forkbook"
version = "0.1.0"
description = "Self-hosted recipe and cooking notebook"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.133.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.26",
    "uvicorn>=0.41.0",
    "cryptography>=49.0.0",
    "aiosqlite>=0.22.1",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.ruff.lint]
select = [
    "I",
    "F",
]

[tool.pytest.ini_options]
pythonpath = "."
